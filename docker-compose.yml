services:
  # --- 1. TU WEB (FRONTEND CON VITE) ---
  web:
    image: node:20-alpine
    container_name: messy-mood-frontend
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:5173"  # Vite usa el 5173 por defecto, lo sacamos por el 3000
    # Instalamos dependencias y levantamos Vite exponiéndolo a la red de Docker
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - messy-network
    restart: always

  # --- 2. BASE DE DATOS (BASEROW) ---
  baserow:
    image: baserow/baserow:latest
    container_name: messy-mood-baserow
    environment:
      #- BASEROW_PUBLIC_URL=http://localhost:8080
      #- BASEROW_EXTRA_ALLOWED_HOSTS=baserow,172.20.0.4
      #- BASEROW_CADDY_ADDRESSES=:80
      #- BASEROW_CORS_ALLOW_ALL_ORIGINS=true
      #- BASEROW_WEBHOOKS_ALLOW_PRIVATE_ADDRESS=true
      #- BASEROW_WEBHOOKS_ALLOW_LOOPBACK_REQUESTS=true
      #- BASEROW_DISABLE_WEBHOOK_HOST_VALIDATION=true
      - BASEROW_PUBLIC_URL=http://172.20.0.4:8080
      #- BASEROW_CADDY_SKIP_HOST_CHECK=true
      #- BASEROW_DISABLE_CADDY=true
      #- BASEROW_CORS_ALLOW_ALL_ORIGINS=true
    ports:
      - "8080:80"
    volumes:
      - baserow_data:/baserow/data
    restart: always
    networks:
      - messy-network

  # --- 3. AUTOMATIZACIÓN (N8N) ---
  n8n:
    image: n8nio/n8n:latest
    container_name: messy-mood-n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=TuPasswordSegura # ¡Cámbiala luego!
      - N8N_BASIC_AUTH_FOR_WEBHOOKS=false
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=false
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always
    networks:
      - messy-network

volumes:
  baserow_data:
    external: true
    name: desktop_baserow_data
  n8n_data:
    external: true
    name: desktop_n8n_data

networks:
  messy-network:
    driver: bridge